[package]
name = "setback"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
libsetback = { path = "../libsetback", features = ["client"] }
uuid.workspace = true

[features]
default = ["desktop"]
web = ["dioxus/web", "uuid/js"]
desktop = ["dioxus/desktop"]