<!--
  Component: Button
  Usage reference. Base class `.btn`, combine with one variant modifier
  and one size modifier.

  Variants: .btn--primary .btn--ghost .btn--danger .btn--link
  Sizes:    .btn--lg .btn--md .btn--sm .btn--icon
  Extra:    .btn--full (100% width)
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Component — Button</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="button.css">
<style>
  .demo-grid { display: flex; flex-wrap: wrap; gap: var(--space-4); padding: var(--space-6); align-items: center; }
  .demo-label { width: 100%; color: var(--gold-300); font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.2em; text-transform: uppercase; margin-top: var(--space-5); }
</style>
</head>
<body>
<div class="table-backdrop"></div>
<div class="demo-grid">
  <p class="demo-label">Variants</p>
  <button class="btn btn--primary btn--md">Start Game</button>
  <button class="btn btn--md">Settings</button>
  <button class="btn btn--ghost btn--md">Cancel</button>
  <button class="btn btn--danger btn--md">Leave Game</button>
  <button class="btn btn--link">Forgot password?</button>

  <p class="demo-label">Sizes</p>
  <button class="btn btn--primary btn--lg">Large</button>
  <button class="btn btn--primary btn--md">Medium</button>
  <a class="btn">Medium</a>
  <button class="btn btn--primary btn--sm">Small</button>
  <button class="btn btn--ghost btn--icon" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <a class="btn btn--ghost btn--icon" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </a>

  <p class="demo-label">Disabled</p>
  <button class="btn btn--primary btn--md" disabled>Unavailable</button>
</div>
</body>
</html>
