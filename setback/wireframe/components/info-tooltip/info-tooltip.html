<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Component — Info Tooltip</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="info-tooltip.css">
<style>.app-shell{align-items:flex-start; padding-top: 8rem;} .row{color:var(--cream-100);}</style>
</head>
<body>
<div class="table-backdrop"></div>
<div class="app-shell">
  <div class="row gap-2">
    <span>Dealer Override</span>
    <span class="info-icon" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span class="info-icon__tip">If a player bids 4, the dealer may override the bid by bidding 4.</span>
    </span>
  </div>
</div>
</body>
</html>
