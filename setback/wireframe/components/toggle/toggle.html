<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Component — Toggle</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="toggle.css">
<style>.app-shell{align-items:flex-start;}</style>
</head>
<body>
<div class="table-backdrop"></div>
<div class="app-shell">
  <label class="toggle">
    <input type="checkbox" checked>
    <span class="toggle__track"><span class="toggle__thumb"></span></span>
    <span class="toggle__label">Fullscreen<small>Play in a borderless full-screen window</small></span>
  </label>
</div>
</body>
</html>
