<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Component — Card Chip</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="card-chip.css">
<style>.app-shell{flex-direction:row; gap:1.5rem;}</style>
</head>
<body>
<div class="table-backdrop"></div>
<div class="app-shell">
  <div class="card-chip card-chip--red">
    <span class="card-chip__corner">A<br>♥</span>
    <span class="card-chip__pip">♥</span>
  </div>
  <div class="card-chip">
    <span class="card-chip__corner">K<br>♠</span>
    <span class="card-chip__pip">♠</span>
  </div>
  <div class="card-chip card-chip--back"></div>
  <div class="card-chip card-chip--sm card-chip--red">
    <span class="card-chip__corner">J<br>♦</span>
    <span class="card-chip__pip">♦</span>
  </div>
</div>
</body>
</html>
