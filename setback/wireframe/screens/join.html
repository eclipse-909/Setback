<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setback — Join a Table</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../components/button/button.css">
<link rel="stylesheet" href="../components/panel/panel.css">
<link rel="stylesheet" href="../components/text-input/text-input.css">
<link rel="stylesheet" href="../components/toast/toast.css">
</head>
<body>
<div class="table-backdrop"></div>
<a class="btn btn--ghost btn--icon back-button" href="multiplayer.html" aria-label="Back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<main class="app-shell">
  <div class="screen">
    <div class="top-bar">
      <h1 class="top-bar__title">Join a Table</h1>
    </div>

    <div class="panel panel--md">
      <div class="panel__inner">
        <div class="panel__header">
          <p class="eyebrow">Find a Seat</p>
          <h2 class="panel__title">How would you like to join?</h2>
        </div>
        <div class="panel__body">

          <div class="option-grid">
            <a class="option-card" href="browse-games.html">
              <span class="option-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg>
              </span>
              <span class="option-card__title">Public</span>
              <span class="option-card__desc">Browse open tables</span>
            </a>
            <button class="option-card" type="button" id="privateOption">
              <span class="option-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              </span>
              <span class="option-card__title">Private</span>
              <span class="option-card__desc">Enter a code &amp; password</span>
            </button>
          </div>

          <div id="privateJoinFields" hidden>
            <div class="divider-suit"><span>♣</span></div>
            <div class="stack gap-4">
              <div class="field">
                <label class="field__label" for="joinCode">Table Code</label>
                <input class="text-input text-input--code" id="joinCode" maxlength="6" placeholder="AB12CD">
              </div>
              <div class="field">
                <label class="field__label" for="joinPassword">Password</label>
                <input class="text-input" type="password" id="joinPassword" placeholder="Table password">
              </div>
              <p class="field__hint">Demo credentials: code <strong>DEMO1</strong>, password <strong>setback</strong></p>
            </div>
          </div>

        </div>
        <div class="panel__footer">
          <a class="btn btn--ghost btn--md" href="multiplayer.html">Cancel</a>
          <button class="btn btn--primary btn--md" id="joinPrivateBtn" hidden>Join Table</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="toast-region"></div>

<script src="../js/app.js"></script>
<script>
  const privateOption = document.getElementById('privateOption');
  const privateFields = document.getElementById('privateJoinFields');
  const joinBtn = document.getElementById('joinPrivateBtn');

  privateOption.addEventListener('click', () => {
    privateOption.classList.toggle('is-selected');
    const show = privateOption.classList.contains('is-selected');
    privateFields.hidden = !show;
    joinBtn.hidden = !show;
  });

  joinBtn.addEventListener('click', () => {
    const code = document.getElementById('joinCode').value.trim().toUpperCase();
    const pass = document.getElementById('joinPassword').value;
    if (code === 'DEMO1' && pass === 'setback') {
      window.location.href = 'lobby.html?context=multi&role=guest';
    } else {
      showToast('Incorrect game code or password.', 'error');
    }
  });
</script>
</body>
</html>
