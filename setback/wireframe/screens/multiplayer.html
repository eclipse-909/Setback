<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setback — Multiplayer</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../components/button/button.css">
<link rel="stylesheet" href="../components/panel/panel.css">
</head>
<body>
<div class="table-backdrop"></div>
<a class="btn btn--ghost btn--icon back-button" href="../index.html" aria-label="Back to main menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<main class="app-shell">
  <div class="screen">
    <div class="top-bar">
      <h1 class="top-bar__title">Multiplayer</h1>
    </div>

    <div class="panel panel--md">
      <div class="panel__inner">
        <div class="panel__header">
          <p class="eyebrow">Take a Seat</p>
          <h2 class="panel__title">Host or Join</h2>
          <p class="panel__subtitle">Start your own table, or find one already dealt.</p>
        </div>
        <div class="panel__body">
          <div class="option-grid">
            <a class="option-card" href="host-game.html">
              <span class="option-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/></svg>
              </span>
              <span class="option-card__title">Host</span>
              <span class="option-card__desc">Create a public or private table</span>
            </a>
            <a class="option-card" href="join.html">
              <span class="option-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
              </span>
              <span class="option-card__title">Join</span>
              <span class="option-card__desc">Browse public tables or enter a code</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../js/app.js"></script>
</body>
</html>
