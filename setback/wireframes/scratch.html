<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Scratch Space</title>
	<style>
		body {
            display: flex;
			width: 100%;
			height: 100%;
			background: #000000;
		}

		#back {
            display: flex;
			width: 1500px;
			height: 500px;
			background: red;
		}

		#left {
            width: 250px;
            height: 250px;
			background: blue;
            margin: 25px;
            padding: 25px;
			border-radius: 10px;
			border: solid 2px white;
		}

		#left:hover {
			transform: translateX(90px);
		}

        #right {
            width: 250px;
            height: 250px;
            background: blue;
            margin: 25px;
            padding: 25px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            outline: none;
            color: #fff;
            background-color: green;
            border: none;
            border-radius: 5px;
        }

        /* Adding styles on 'active' state */
        .btn:hover {
            box-shadow: 7px 6px 28px 1px rgba(0, 0, 0, 0.24);
            transform: translateY(40px);
            /* Moving button 4px to y-axis */
        }
	</style>
</head>
<body>
	<div id="back">
		<div id="left"></div>
		<div id="right"></div>
		<button class="btn">Click Me</button>
	</div>
</body>
</html>
