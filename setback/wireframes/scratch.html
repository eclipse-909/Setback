<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Scratch Space</title>
	<style>
		body {
            display: flex;
			width: 1000px;
			height: 1000px;
            justify-content: center;
            align-items: center;
		}

		#back {
            display: flex;
			width: 50%;
			height: 50%;
			background: red;
		}

		#front {
            display: flex;
            width: 50%;
            height: 50%;
			background: blue;
            margin: 25px;
            padding: 25px;
            border: 25px solid green;
            border-radius: 25px 25px 25px 2px;
            box-shadow: 10px 10px 5px 12px lightblue;
		}
	</style>
</head>
<body>
	<div id="back">
		<div id="front"></div>
	</div>
</body>
</html>
