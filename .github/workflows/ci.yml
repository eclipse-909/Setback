name: Setback CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  ci:
    name: CI
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, llvm-tools-preview, miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-llvm-cov,cargo-audit
      - name: Audit
        run: cargo audit
      - name: Formatting
        run: cargo +nightly fmt --all --check
      - name: Clippy
        run: cargo +nightly clippy --workspace --all-targets --locked -- -D warnings
      - name: Miri
        run: cargo +nightly miri test -p libsetback --test arena --locked
#      - name: Benchmarks
#        run: cargo +nightly bench --workspace --all-targets --locked
      - name: Tests
        run: cargo +nightly test --workspace --all-targets --locked
      - name: Coverage
        run: >
          cargo llvm-cov --workspace --all-targets --locked
          --fail-under-lines 80
          --fail-under-functions 80
          --fail-under-regions 80