name: Setback CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::warning::Code formatting issues detected. Run 'cargo fmt' locally to fix."
          else
            echo "✓ Code formatting is correct."
          fi

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Check all workspaces
        run: cargo check --workspace --all-targets --all-features --locked -vv
      - name: Build timing report
        if: github.event_name == push && github.ref == 'refs/heads/main'
        run: |
          cargo install cargo-timing
          cargo timing --html timing-report.html
      - name: Upload timing report
        if: github.event_name == push && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-timing-report
          path: timing-report.html

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -vv -- -D warnings

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    needs: [clippy]
    strategy:
      matrix:
        include:
          # Linux-only packages (server components)
          - os: ubuntu-latest
            package: admin_controller
          - os: ubuntu-latest
            package: setback_server
          - os: ubuntu-latest
            package: setback_website
          - os: ubuntu-latest
            package: libsetback
          # Cross-platform package (client)
          - os: ubuntu-latest
            package: setback
          - os: windows-latest
            package: setback
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libssl-dev libxkbcommon-dev
      - name: Run tests for ${{ matrix.package }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo test -p ${{ matrix.package }} --all-targets --all-features --locked -vv
            cargo test -p ${{ matrix.package }} --doc --all-features --locked -vv
          else
            cargo test -p setback --all-targets --all-features --locked -vv
            cargo test -p setback --doc --all-features --locked -vv
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libssl-dev libxkbcommon-dev
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - name: Generate coverage report
        run: cargo tarpaulin --workspace --all-targets --all-features --locked -v --out Xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eclipse-909/Setback-Source
          fail_ci_if_error: true

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
      - name: Run security audit
        run: cargo deny check --all-features
      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated
          cargo outdated --exit-code 1 || echo "::warning::Some dependencies are outdated. Consider updating them."

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libssl-dev libxkbcommon-dev
      - name: Run benchmarks
        run: cargo bench --workspace --all-targets --all-features --locked -vv

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libssl-dev libxkbcommon-dev
      - name: Generate documentation
        run: cargo doc --workspace --lib --bins --examples --all-features --no-deps --locked -vv
      # - name: Deploy documentation
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./target/doc

  build-and-package:
    name: Build and Package
    runs-on: ${{ matrix.os }}
    needs: [coverage, audit, bench, docs]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: setback
            folder_name: Setback-Linux64
            archive_name: Setback-Linux64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: setback.exe
            folder_name: Setback-Win64
            archive_name: Setback-Win64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libssl-dev libxkbcommon-dev
      - name: Build all packages
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Build all packages for Linux
            cargo build --workspace --release --locked
          else
            # Build only setback for Windows
            cargo build -p setback --release --target ${{ matrix.target }} --locked
          fi
      - name: Verify assets folder exists
        run: |
          if [ ! -d "setback/assets" ]; then
            echo "Error: setback/assets folder is missing!
            exit 1
          fi
          echo "Assets folder found at setback/assets"
      - name: Prepare client package
        run: |
          mkdir -p ${{ matrix.folder_name }}/Setback
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.folder_name }}/Setback/
          chmod +x ${{ matrix.folder_name }}/Setback/${{ matrix.artifact_name }}
          cp -r setback/assets ${{ matrix.folder_name }}/Setback/
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar -czf ${{ matrix.archive_name }} ${{ matrix.folder_name }}/
          else
            powershell Compress-Archive -Path ${{ matrix.folder_name }} -DestinationPath ${{ matrix.archive_name }} -Force
          fi
      - name: Prepare server package (Linux only)
        if: runner.os == 'Linux'
        run: |
          mkdir -p SetbackServer
          cp target/release/admin_controller SetbackServer/
          cp target/release/setback_server SetbackServer/
          cp target/release/setback_website SetbackServer/
          chmod +x SetbackServer/*
          tar -czf SetbackServer.tar.gz SetbackServer/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
      - name: Upload server artifacts (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SetbackServer.tar.gz
          path: SetbackServer.tar.gz

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-and-package]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            downloaded-artifacts/Setback-Linux64.tar.gz
            downloaded-artifacts/Setback-Win64.zip
            downloaded-artifacts/SetbackServer.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}