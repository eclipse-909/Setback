name: Setback CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - name: Check formatting
        run: cargo +nightly fmt --all --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - name: Check all workspaces
        run: cargo +nightly check --workspace --all-targets --all-features --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - name: Run clippy
        run: cargo +nightly clippy --workspace --all-targets --all-features --locked -- -D warnings

  miri:
    name: Miri
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux-only packages (server components)
          - os: ubuntu-latest
            package: setback_server
          - os: ubuntu-latest
            package: setback_website
          - os: ubuntu-latest
            package: libsetback
          - os: ubuntu-latest
            package: setbackctl
          - os: ubuntu-latest
            package: setbackd
          # Cross-platform package (client)
          - os: ubuntu-latest
            package: setback
          - os: windows-latest
            package: setback
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup
      - name: Run miri test for ${{ matrix.package }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo miri test -p ${{ matrix.package }} --all-targets --all-features --locked
            cargo miri test -p ${{ matrix.package }} --doc --all-features --locked
          else
            cargo miri test -p setback --all-targets --all-features --locked
            cargo miri test -p setback --doc --all-features --locked
          fi

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux-only packages (server components)
          - os: ubuntu-latest
            package: setback_server
          - os: ubuntu-latest
            package: setback_website
          - os: ubuntu-latest
            package: libsetback
          - os: ubuntu-latest
            package: setbackctl
          - os: ubuntu-latest
            package: setbackd
          # Cross-platform package (client)
          - os: ubuntu-latest
            package: setback
          - os: windows-latest
            package: setback
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - name: Run tests for ${{ matrix.package }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo +nightly test -p ${{ matrix.package }} --all-targets --all-features --locked
            cargo +nightly test -p ${{ matrix.package }} --doc --all-features --locked
          else
            cargo +nightly test -p setback --all-targets --all-features --locked
            cargo +nightly test -p setback --doc --all-features --locked
          fi

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - name: Run benchmarks
        run: cargo +nightly bench --workspace --all-targets --all-features --locked

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - name: Generate documentation
        run: cargo +nightly doc --workspace --lib --bins --examples --all-features --document-private-items --locked

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - uses: taiki-e/install-action@2
        with:
          tool: cargo-tarpaulin
      - name: Generate coverage report
        run: cargo +nightly tarpaulin

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [ format, audit, clippy, bench, coverage, docs ]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: setback
            folder_name: Setback-Linux64
            archive_name: Setback-Linux64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: setback.exe
            folder_name: Setback-Win64
            archive_name: Setback-Win64.zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: true"
          cache-workspace-crates: "true"
      - name: Build all packages
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Build all packages for Linux
            cargo +nightly build --workspace --release --locked
          else
            # Build only setback for Windows
            cargo +nightly build -p setback --release --target ${{ matrix.target }} --locked
          fi
      - name: Prepare client package
        run: |
          mkdir -p ${{ matrix.folder_name }}/Setback
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.folder_name }}/Setback/
          chmod +x ${{ matrix.folder_name }}/Setback/${{ matrix.artifact_name }}
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar -czf ${{ matrix.archive_name }} ${{ matrix.folder_name }}/
          else
            powershell Compress-Archive -Path ${{ matrix.folder_name }} -DestinationPath ${{ matrix.archive_name }} -Force
          fi
      - name: Prepare server package (Linux only)
        if: runner.os == 'Linux'
        run: |
          mkdir -p SetbackServer
          cp target/release/setback_server SetbackServer/
          cp target/release/setback_website SetbackServer/
          cp target/release/setbackctl SetbackServer/
          cp target/release/setbackd SetbackServer/
          chmod +x SetbackServer/*
          cp -r setback_website/client SetbackServer/
          cp setback_website/.env.release SetbackServer/
          cp setbackd/setback.service SetbackServer/
          tar -czf SetbackServer.tar.gz SetbackServer/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
      - name: Upload server artifacts (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SetbackServer.tar.gz
          path: SetbackServer.tar.gz

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build ]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            downloaded-artifacts/Setback-Linux64.tar.gz
            downloaded-artifacts/Setback-Win64.zip
            downloaded-artifacts/SetbackServer.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}