name: Setback CD Pipeline

on:
  pull_request:
    branches:
      - prod

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  main_to_prod:
    name: Check Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Only allow main -> prod PRs
        run: |
          echo "PR from: ${{ github.head_ref }}"
          if [ "${{ github.head_ref }}" != "main" ]; then
            echo "PRs into prod must come from main"
            exit 1
          fi
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [main_to_prod]
    steps:
      - run: ./cd_deploy.sh