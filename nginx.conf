# ============================================================
# nginx.conf
#
# This file is just a template and should not be used as an
# nginx configuration file directly.
#
# Services:
#   - Website (HTTP container)  : http://setback_website:8080
#   - Game server (TCP/TLS)     : {SETBACK_SERVER_UPSTREAM}
#
# TLS certificates are expected at:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
#
# To update the active game server, replace the upstream block
# in the stream section. Search for SETBACK_SERVER_UPSTREAM.
# ============================================================

# ============================================================
# EVENT / WORKER SETTINGS
# ============================================================

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

# ============================================================
# HTTP BLOCK — website reverse proxy (HTTPS)
# ============================================================

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # --- Logging ---
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --- Hide nginx version from error pages and headers ---
    server_tokens off;

    # --- SSL global settings ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- OCSP stapling (speeds up TLS handshake for clients) ---
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # --- Rate limiting zones ---
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;

    # ----------------------------------------------------------
    # Redirect all plain HTTP to HTTPS
    # ----------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------
    # HTTPS — website reverse proxy
    # ----------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # --- Security headers ---
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                       always;
        add_header X-Frame-Options           "SAMEORIGIN"                                    always;
        add_header X-XSS-Protection          "1; mode=block"                                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;

        # Adjust the Content-Security-Policy to match your site's needs
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

        # --- Rate limiting ---
        limit_req zone=general burst=20 nodelay;

        # --- Proxy to web container ---
        location / {
            proxy_pass         http://setback_website:8080;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}


# ============================================================
# STREAM BLOCK — game server TCP proxy (TLS)
# ============================================================

stream {

    # --- SSL settings for the stream ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:STREAMSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Logging ---
    log_format stream_log '$remote_addr [$time_local] $protocol $status '
                          '$bytes_sent $bytes_received $session_time '
                          '"$upstream_addr"';

    access_log /var/log/nginx/stream_access.log stream_log;
    error_log  /var/log/nginx/stream_error.log warn;

    # ----------------------------------------------------------
    # Active game server upstream
    #
    # Replace SETBACK_SERVER_UPSTREAM with the container name when
    # regenerating this file. All draining servers should also
    # be listed here with the "down" flag so they are preserved
    # in the worker config during graceful drain.
    #
    # Example during a drain:
    #
    #   upstream setback_server {
    #       server setback_server-v3:42069 down;   # draining
    #       server setback_server-v4:42069;        # active
    #   }
    # ----------------------------------------------------------
    upstream setback_server {
        server SETBACK_SERVER_UPSTREAM:42069;
    }

    # ----------------------------------------------------------
    # TLS listener — clients connect here
    # ----------------------------------------------------------
    server {
        listen 42069 ssl;

        proxy_pass    setback_server;

        # How long nginx waits for the upstream to accept the connection
        proxy_connect_timeout 10s;

        # Keep the tunnel alive while a game is in progress.
        # Set to slightly longer than your maximum expected game length.
        proxy_timeout 7200s;  # 2 hours — adjust as needed
    }
}
