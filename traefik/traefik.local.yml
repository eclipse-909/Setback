# traefik/traefik.local.yml — Local static configuration
#
# Mounted into the Traefik container as /etc/traefik/traefik.yml by
# compose.local.yml.
#
# Local specifics:
#   - No certificate resolver (self-signed certs via file provider)
#   - Dashboard exposed insecurely on :8080 (localhost only via compose port binding)
#   - Log level DEBUG for visibility
#   - No HTTPS enforcement on the API

# traefik dashboard
api:
  debug: true
  dashboard: true
  disabledashboardad: true
  insecure: true # binds to :8080 with http in local development builds

entryPoints:
  # setback-website (HTTP -> HTTPS)
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # setback-website (HTTPS)
  websecure:
    address: ":443"
    http:
      tls: {}

  setback-service:
    address: ":42069"

  phpmyadmin:
    address: ":8081"
    http: {}

  mysql:
    address: ":3306"
    mysql: {}

tls:
  certificates:
    - certFile: /etc/traefik/certs/cert.pem
      keyFile:  /etc/traefik/certs/key.pem

  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

    # Named option set referenced by the TCP router label in compose.local.yml
    local:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

http:
  middlewares:

    # --- Security response headers ---
    # Applied to all HTTP routers via labels in compose.yml
    security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "geolocation=(), microphone=(), camera=()"
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

    # --- Rate limiting ---
    # 100 requests/second average with a burst of 200.
    # Adjust these values based on your expected traffic.
    rate-limit:
      rateLimit:
        average: 100
        burst: 200

    # --- Dashboard basic auth (prod only) ---
    # Password is an htpasswd-encoded string.
    # Generate with: htpasswd -nb admin yourpassword
    # Then set TRAEFIK_DASHBOARD_AUTH in .env.prod.
    # The double-$ is required in Docker labels to escape the $ character,
    # but in this YAML file a single $ is correct.
    dashboard-auth:
      basicAuth:
        users:
          - "${TRAEFIK_DASHBOARD_AUTH}"

providers:
  docker:
    exposedByDefault: false
    network: proxy_net
    watch: true

log:
  level: DEBUG

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100
