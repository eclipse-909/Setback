# traefik/traefik.dev.yml — Development static configuration
#
# Mounted into the Traefik container as /etc/traefik/traefik.yml by
# compose.dev.yml.
#
# Dev specifics vs prod:
#   - No certificate resolver (self-signed certs via file provider)
#   - Dashboard exposed insecurely on :8080 (localhost only via compose port binding)
#   - Log level DEBUG for visibility
#   - No HTTPS enforcement on the API

api:
  dashboard: true
  insecure: true   # Dashboard on :8080 — safe because compose binds it to 127.0.0.1 only

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls: {}

  tcp-service:
    address: ":42069"

providers:
  docker:
    exposedByDefault: false
    network: proxy_net
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: DEBUG

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100
