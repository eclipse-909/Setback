# Compose config for locally running backend setback services.
# Not used for production.

name: setback-services

services:
  mysql:
    image: mysql:latest
    restart: always
    env_file:
      - setback_website/.env.debug
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
  dbgui:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8081:80

volumes:
  mysql_data: