# Compose config for locally running backend setback services.
# Not used for production.

name: setback-services

services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: setback_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  db_gui:
    image: phpmyadmin:alpine
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  setback_website:
    image: eclipse909/private:setback_website-latest
    build: ./setback_website
    environment:
      DATABASE_URL: mysql://root:debug@mysql:3306/setback_dev
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -L http://127.0.0.1:8080/api/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"        # HTTP  → redirect to HTTPS
      - "443:443"      # HTTPS → setback_website
      - "42069:42069"  # TLS   → setback_server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      setback_website:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  default:
    name: setback-services_default
    attachable: true