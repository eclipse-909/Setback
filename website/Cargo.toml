[package]
name = "website"
version = "0.1.0"
edition = "2021"

[dependencies]
resources = { path = "../resources" }
actix-web = "*"
actix-files = "*"
actix-session = { version = "*", features = ["cookie-session"] }
rusqlite = { version = "*", features = ["bundled"] }
argon2 = { version = "*", features = ["password-hash", "std"] }
r2d2 = "*"
r2d2_sqlite = "*"
serde = { version = "*", features = ["derive"] }
futures-util = "*"