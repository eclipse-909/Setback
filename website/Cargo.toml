[package]
name = "website"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
actix-web = "4.9.0"
jsonwebtoken = "9.3.0"
chrono = "0.4.39"
actix-files = "0.6.6"
actix-session = { version = "0.10.1", features = ["cookie-session"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "tls-native-tls", "mysql", "sqlite", "chrono"] }#Sqlite can be a dev-dep
serde = { version = "1.0.217", features = ["derive"] }
futures-util = "0.3.31"
serde_json = "1.0.138"
lazy_static = "1.5.0"
dotenv = "0.15.0"