<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Login Setback</title>
		<link rel="stylesheet" href="/css/global.css">
		<link rel="stylesheet" href="/css/login.css">
	</head>
	<body>
		<script src="/js/login.js"></script>
		<header>
			<div class="container">
				<button type="button"><a href="/">Setback</a></button>
				<a href="/download.html" class="btn-download">Download Now</a>
			</div>
		</header>
		<nav>
			<div class="container">
				<ul>
					<li><a href="/">Home</a></li>
					<li><a href="/download.html">Download</a></li>
					<li><a href="/login.html">Login</a></li>
				</ul>
			</div>
		</nav>
		<div class="wrapper">
			<div class="auth-container">
				<div class="tabs">
					<button class="tab-btn active" onclick="showForm('login')">Login</button>
					<button class="tab-btn" onclick="showForm('signup')">Create Account</button>
				</div>
				<div id="login-form" class="form active">
					<h2>Login</h2>
					<form>
						<label for="login-username">Username</label>
						<input type="text" id="login-username" placeholder="Enter your username" required>

						<label for="login-password">Password</label>
						<input type="password" id="login-password" placeholder="Enter your password" required>

						<button type="submit" class="submit-btn" onclick="login()">Log In</button>
					</form>
				</div>
				<div id="signup-form" class="form">
					<h2>Create Account</h2>
					<form>
						<label for="signup-username">Username</label>
						<input type="text" id="signup-username" placeholder="Create your username" required>

						<label for="signup-password">Password</label>
						<input type="password" id="signup-password" placeholder="Create a password" required>

						<button type="submit" class="submit-btn" onclick="signup()">Sign Up</button>
					</form>
				</div>
			</div>
		</div>
		<footer>
			<div class="container">
				<p>&copy; 2024 Setback. All rights reserved.</p>
			</div>
		</footer>
	</body>
</html>
