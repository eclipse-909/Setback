[workspace]
members = ["bevy_game", "setback", "server", "terminal_game", "website", "game"]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."terminal_game"]
debug = true
debug-assertions = true
overflow-checks = true
opt-level = 0

[profile.dev.package."setback"]
debug = true
debug-assertions = true
overflow-checks = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"

[profile.wasm-release]
inherits = "release"
strip = "debuginfo"
