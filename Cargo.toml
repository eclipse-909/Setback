[workspace]
members = [
	"api",
	"libsetback",
	"server",
	"setback",
]
resolver = "3"

[profile.debug]
opt-level = 0
debug = true
lto = false
package."*" = { opt-level = 1 }

# default profile when not specified
[profile.dev]
opt-level = 1
debug = "limited"
lto = false
package."*" = { opt-level = 3 }

[profile.release]
codegen-units = 1
debug = "limited"
lto = true

[profile.wasm-release]
inherits = "release"
opt-level = "s" # also try "z"
debug = false
strip = "debuginfo"

[workspace.dependencies]
arena = { git = "https://github.com/eclipse-909/arena" }
argon2 = "0.6.0"
arrayvec = { version = "0.7.8", features = ["serde"] }
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
dioxus = "0.7.10"
futures = "0.3.34"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
gloo = { version = "0.13.0", default-features = false, features = ["net", "timers", "futures"] }
gpui-kit = { version = "0.10.0", features = ["gpui-fast"] }
http = "1.5.0"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
konst = "0.4.3"
lettre = { version = "0.11.24", default-features = false, features = [
	"builder",
	"smtp-transport",
	"tokio1-rustls",
	"aws-lc-rs",
	"webpki-roots",
] }
libsetback = { path = "./libsetback" }
nanoid = "0.5.0"
postcard = "1.2.0"
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
rustls = "0.23.46"
scc = "3.9.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
# TODO: sockudo-ws author recommends mimalloc feature for production, investigate
sockudo-ws = { version = "3.1.1", features = ["rustls-webpki-roots", "aws_lc_rs"] }
sqlx = { version = "0.9.1", default-features = false, features = [
	"runtime-tokio",
	"postgres",
	"chrono",
	"json",
	"macros",
	"migrate",
	"uuid",
	"ipnet",
] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-rustls = "0.26.6"
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
trybuild = "1.0.125"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "time", "openapi_extensions"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "cache"] }
uuid = { version = "1.29.3", features = ["v4"] }
webpki-roots = "1.0.12"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
new_without_default = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "allow"