[workspace]
members = [
	"libsetback",
	"setback",
	# "setback_server",
	# "setback_website",
	# "setbackctl",
	# "setbackd"
]
resolver = "3"

[profile.dev]
lto = "off"

[profile.dev.package."libsetback"]
inherits = "dev"

[profile.dev.package."*"]
inherits = "dev"
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
debug = true

[profile.release.package."libsetback"]
inherits = "release"

[profile.release.package."*"]
inherits = "release"
debug = false
strip = "debuginfo"

[workspace.dependencies]
actix-files = "0.6.9"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = { version = "4.12.1" }
bincode = "2.0.1"
chrono = "0.4.42"
dotenv = "0.15.0"
futures = "0.3.31"
futures-util = "0.3.31"
glyphon = "0.10.0"
image = { version = "0.25.9", features = ["gif"] }
jsonwebtoken = "10.2.0"
keyframe = "1.1.1"
keyring = { version = "3.6.3", features = ["linux-native-async-persistent", "windows-native", "crypto-rust", "vendored", "tokio"] }
lab = "0.11.0"
lazy_static = "1.5.0"
libsetback = { path = "./libsetback" }
log = { version = "0.4.29", features = ["max_level_debug", "release_max_level_warn"] }
once_cell = "1.21.3"
open = "5.3.3"
paste = "1.0.15"
pollster = "0.4.0"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.12.26", features = ["cookies", "json"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smallvec = "1.15.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "macros", "migrate", "any"] }
taffy = { version = "0.9.2", default-features = false, features = ["calc", "content_size", "flexbox", "std", "alloc"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
trybuild = "1.0.114"
unicode-segmentation = "1.12.0"
vello = "0.5.1" # keep at 0.5.1 because 0.6.0 breaks wgpu for some reason
whoami = "1.6.1"
winit = { version = "0.30.12", features = ["serde"] }