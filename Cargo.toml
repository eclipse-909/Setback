[workspace]
members = [
	"libsetback",
	"setback",
	"setback_server",
	"setback_website", "setbackctl",
	"setbackd"
]
resolver = "3"

[profile.dev]
lto = "off"

[profile.dev.package."libsetback"]
inherits = "dev"

[profile.dev.package."*"]
inherits = "dev"
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
debug = true

[profile.release.package."libsetback"]
inherits = "release"

[profile.release.package."*"]
inherits = "release"
debug = false
strip = "debuginfo"

[workspace.dependencies]
actix-files = "0.6.6"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = { version = "4.11.0" }
bevy = { version = "0.16.1", default-features = false, features = [
	"async_executor",
	"bevy_asset",
	"bevy_audio",
	"bevy_color",
	"bevy_core_pipeline",
	"bevy_input_focus",
	"bevy_log",
	"bevy_picking",
	"bevy_render",
	"bevy_sprite",
	"bevy_sprite_picking_backend",
	"bevy_state",
	"bevy_text",
	"bevy_ui",
	"bevy_ui_picking_backend",
	"bevy_window",
	"bevy_winit",
	"custom_cursor",
	"default_font",
	"multi_threaded",
	"png",
	"std",
	"sysinfo_plugin",
	"x11",
	"bevy_debug_stepping",
	"bevy_image",
	"bevy_ui_debug",
	"gif",
	"serialize",
	"wayland"
] }
bevy_framepace = "0.19.1"
bevy-inspector-egui = "0.33.1"
#bevy_ui_text_input = "0.5.2"
bevy_ui_text_input = { git = "https://github.com/ickshonpe/bevy_ui_text_input.git", rev = "refs/pull/25/head" }
bincode = "2.0.1"
chrono = "0.4.41"
dotenv = "0.15.0"
futures = "0.3.31"
futures-util = "0.3.31"
image = "0.25.6"
jsonwebtoken = "9.3.1"
keyring = { version = "3.6.3", features = ["linux-native-async-persistent", "windows-native", "crypto-rust", "vendored", "tokio"] }
lazy_static = "1.5.0"
libsetback = { path = "./libsetback" }
log = { version = "0.4.27", features = ["max_level_debug", "release_max_level_warn"] }
once_cell = "1.21.3"
open = "5.3.2"
rand = "0.9.2"
regex = "1.11.2"
reqwest = { version = "0.12.23", features = ["cookies", "json"] }
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres", "sqlite", "chrono"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.16"
tracing-appender = "0.2.3"
whoami = "1.6.1"
winit = "0.30.12"