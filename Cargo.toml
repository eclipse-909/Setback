[workspace]
members = [
	"api",
	"libsetback",
	"server",
	"setback",
	"website",
]
resolver = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = "limited"
strip = "debuginfo"

[profile.release.package."*"]
debug = false

[workspace.dependencies]
argon2 = "0.6.0"
arrayvec = { version = "0.7.8", features = ["serde"] }
axum = "0.8.9"
bytes = "1.12.1"
const_format = "0.2.36"
dioxus = "0.7.10"
dotenvy = "0.15.7"
futures = "0.3.34"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
gloo = { version = "0.12.0", default-features = false, features = ["net", "timers", "futures"] }
http = "1.5.0"
libsetback = { path = "./libsetback" }
postcard = "1.1.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["cookies", "json", "rustls"] }
scc = "3.8.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# TODO: sockudo-ws author recommends mimalloc feature for production, investigate
sockudo-ws = { version = "2.0.1", features = ["io-uring"] }
sqlx = { version = "0.9.0", default-features = false, features = [
	"runtime-tokio",
	"mysql",
	"chrono",
	"json",
	"macros",
	"migrate"
] }
tokio = "1.53.1"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.19"
tower-cookies = { version = "0.11.0", features = ["private"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trybuild = "1.0.120"
uuid = { version = "1.26.0", features = ["v4"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"