[workspace]
members = [
	"libsetback",
	"setback",
	"setback_server",
	"setback_website",
	"setbackctl",
	"setbackd"
]
resolver = "3"

[profile.dev]
lto = "off"

[profile.dev.package."*"]
inherits = "dev"
opt-level = 3

[profile.release]
codegen-units = 1
debug = "limited"
strip = "debuginfo"

[profile.release.package."*"]
inherits = "release"
debug = false

[workspace.dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["multipart"] }
bytes = "1.11.1"
chrono = "0.4.43"
clap = { version = "4.5.60", features = ["derive", "cargo", "env"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.32"
futures-util = "0.3.32"
gpui = "0.2.2"
image = { version = "0.25.9", features = ["gif"] }
jsonwebtoken = "10.3.0"
keyring = { version = "3.6.3", features = [
	"apple-native",
	"windows-native",
	"linux-native-sync-persistent", "crypto-rust"
] }
lazy_static = "1.5.0"
libc = "0.2.182"
libsetback = { path = "./libsetback" }
log = { version = "0.4.29", features = ["max_level_debug", "release_max_level_warn"] }
once_cell = "1.21.3"
open = "5.3.3"
paste = "1.0.15"
pollster = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["cookies", "json", "rustls"] }
rpassword = "7.4.0"
rustls = "0.23.36"
scc = "3.6.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = [
	"runtime-tokio",
	"mysql",
	"chrono",
	"json",
	"macros",
	"migrate"
] }
systemd = "0.10.1"
tokio = { version = "1.49.0", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.18", features = ["codec"] }
tower-cookies = "0.11.0"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
trybuild = "1.0.116"
unicode-segmentation = "1.12.0"
webpki-roots = "1.0.6"
whoami = "2.1.1"