[workspace]
members = [
	"api",
	"libsetback",
	"server",
	"setback",
	"website",
]
resolver = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = "limited"
strip = "debuginfo"

[profile.release.package."*"]
debug = false

[workspace.dependencies]
argon2 = "0.6.0"
arrayvec = { version = "0.7.8", features = ["serde"] }
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
const_format = "0.2.36"
dioxus = "0.7.10"
futures = "0.3.34"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
gloo = { version = "0.12.0", default-features = false, features = ["net", "timers", "futures"] }
hex = "0.4.3"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
konst = "0.4.3"
libsetback = { path = "./libsetback" }
nanoid = "0.5.0"
postcard = "1.1.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["cookies", "json", "rustls"] }
rustls = "0.23"
scc = "3.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# TODO: sockudo-ws author recommends mimalloc feature for production, investigate
sockudo-ws = { version = "2.1.0", features = ["rustls-webpki-roots", "ring"] }
sqlx = { version = "0.9.0", default-features = false, features = [
	"runtime-tokio",
	"mysql",
	"chrono",
	"json",
	"macros",
	"migrate",
	"uuid",
] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = "1.53.1"
tokio-rustls = "0.26.5"
tokio-util = "0.7.19"
tower = "0.5.3"
tower-cookies = { version = "0.11.0", features = ["private"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trybuild = "1.0.121"
uuid = { version = "1.26.1", features = ["v4"] }
webpki-roots = "1.0.9"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
new_without_default = "allow"
