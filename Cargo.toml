[workspace]
members = [
#	"bevy_game",
	"shared",
	"server",
	"terminal_game",
	"website",
	"game"
]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."terminal_game"]
debug = true
debug-assertions = true
overflow-checks = true
opt-level = 0

[profile.dev.package."shared"]
debug = true
debug-assertions = true
overflow-checks = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"

[profile.wasm-release]
inherits = "release"
strip = "debuginfo"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
