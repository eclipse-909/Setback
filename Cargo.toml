[workspace]
members = [
	"api",
	"libsetback",
	"server",
	"setback",
	"website",
]
resolver = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = "limited"
strip = "debuginfo"

[profile.release.package."*"]
debug = false

[workspace.dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "cargo", "env"] }
const_format = "0.2.36"
dioxus = "0.7.10"
dirs = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.33"
futures-util = "0.3.33"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
gloo = { version = "0.12.0", default-features = false, features = ["net", "timers"] }
http = "1.5.0"
image = { version = "0.25.10", features = ["gif"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
keyring = { version = "4.1.6", features = ["v1"] }
lazy_static = "1.5.0"
libc = "0.2.189"
libsetback = { path = "./libsetback" }
log = { version = "0.4.33", features = ["max_level_debug", "release_max_level_warn"] }
once_cell = "1.21.4"
open = "5.4.1"
paste = "1.0.15"
pollster = "1.0.1"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["cookies", "json", "rustls"] }
rpassword = "7.5.4"
rustls = "0.23.43"
scc = "3.8.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
	"runtime-tokio",
	"mysql",
	"chrono",
	"json",
	"macros",
	"migrate"
] }
systemd = "0.10.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-serde = { version = "0.9.0", features = ["bincode"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["codec"] }
tower-cookies = { version = "0.11.0", features = ["private"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trybuild = "1.0.120"
unicode-segmentation = "1.13.3"
uuid = { version = "1.24.0", features = ["v4"] }
webpki-roots = "1.0.9"
whoami = "2.1.2"