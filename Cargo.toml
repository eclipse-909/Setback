[workspace]
members = ["bevy_game", "game", "resources", "server", "terminal_game", "website"]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"

[profile.wasm-release]
inherits = "release"
strip = "debuginfo"
