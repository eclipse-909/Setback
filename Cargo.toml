[workspace]
members = [
	"libsetback",
	"setback",
	# "setback_server",
	"setback_website",
	"setbackctl",
	"setbackd"
]
resolver = "3"

[profile.dev]
lto = "off"

[profile.dev.package."*"]
inherits = "dev"
opt-level = 3

[profile.release]
codegen-units = 1
debug = "limited"
strip = "debuginfo"

[profile.release.package."*"]
inherits = "release"
debug = false

[workspace.dependencies]
argon2 = "0.5.3"
axum = "0.8.8"
bytes = "1.11.0"
chrono = "0.4.43"
clap = "4.5.54"
dotenvy = "0.15.7"
futures = "0.3.31"
futures-util = "0.3.31"
gpui = "0.2.2"
image = { version = "0.25.9", features = ["gif"] }
jsonwebtoken = "10.2.0"
keyring = { version = "3.6.3", features = [
	"apple-native",
	"windows-native",
	"linux-native-sync-persistent", "crypto-openssl"
] }
lazy_static = "1.5.0"
libc = "0.2.180"
libsetback = { path = "./libsetback" }
log = { version = "0.4.29", features = ["max_level_debug", "release_max_level_warn"] }
once_cell = "1.21.3"
open = "5.3.3"
paste = "1.0.15"
pollster = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.13.1", features = ["cookies", "json"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = [
	"runtime-tokio",
	"mysql",
	"chrono",
	"json",
	"macros",
	"migrate"
] }
systemd = "0.10.1"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tower-cookies = "0.11.0"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
trybuild = "1.0.114"
unicode-segmentation = "1.12.0"
whoami = "2.0.2"