[workspace]
members = [
	"game",
	"server",
	"shared",
	"terminal_game",
	"website"
]
resolver = "2"

[profile.game-debug]
inherits = "dev"
lto = "off"
debug = true
debug-assertions = true
overflow-checks = true
opt-level = 0
incremental = true

[profile.dev]
opt-level = 1

[profile.dev.package."terminal_game"]
inherits = "game-debug"

[profile.dev.package."shared"]
inherits = "game-debug"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"