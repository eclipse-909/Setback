[workspace]
members = [
	"keepalive",
	"libsetback",
	"setback",
	"setback_server",
	"setback_website",
	"setbackctl",
]
resolver = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = "limited"
strip = "debuginfo"

[profile.release.package."*"]
debug = false

[workspace.dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["multipart"] }
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive", "cargo", "env"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.32"
futures-util = "0.3.32"
gpui = "0.2.2"
http = "1.4.0"
image = { version = "0.25.10", features = ["gif"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
keyring = { version = "3.6.3", features = [
	"apple-native",
	"windows-native",
	"linux-native-sync-persistent", "crypto-rust"
] }
lazy_static = "1.5.0"
libc = "0.2.182"
libsetback = { path = "./libsetback" }
log = { version = "0.4.29", features = ["max_level_debug", "release_max_level_warn"] }
once_cell = "1.21.4"
open = "5.3.3"
paste = "1.0.15"
pollster = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["cookies", "json", "rustls"] }
rpassword = "7.4.0"
rustls = "0.23.37"
scc = "3.6.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = [
	"runtime-tokio",
	"mysql",
	"chrono",
	"json",
	"macros",
	"migrate"
] }
systemd = "0.10.1"
tokio = { version = "1.51.1", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-serde = { version = "0.9.0", features = ["bincode"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tower-cookies = { version = "0.11.0", features = ["private"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trybuild = "1.0.116"
unicode-segmentation = "1.13.2"
webpki-roots = "1.0.6"
whoami = "2.1.1"