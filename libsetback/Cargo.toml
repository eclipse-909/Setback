[package]
name = "libsetback"
version = "0.1.0"
edition = "2024"

[dependencies]
futures.workspace = true
libsetbackapp = { path = "../libsetbackapp", default-features = false }
postcard.workspace = true
rand.workspace = true
reqwest.workspace = true
scc.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
trybuild.workspace = true
libsetbackapp = { path = "../libsetbackapp", default-features = false }
tracing-subscriber.workspace = true

[features]
client = ["libsetbackapp/client"] # turn off client feature for server
test-dep = []

[[example]]
name = "singleplayer"
required-features = ["client"]

[[test]]
name = "ai_only"
required-features = ["client", "test-dep"]

[lints.clippy]
undocumented_unsafe_blocks = "deny"