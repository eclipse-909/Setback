[package]
name = "libsetback"
version = "0.1.0"
edition = "2024"

[lib]
name = "setback"

# This library needs to target WASM so don't just throw dependencies in here
[dependencies]
arena.workspace = true
arrayvec.workspace = true
bytes.workspace = true
dioxus.workspace = true
futures.workspace = true
postcard.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom.workspace = true
gloo.workspace = true
sqlx = { workspace = true, default-features = false, features = ["derive", "postgres"] }
tokio = { workspace = true, features = ["sync", "macros"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanoid = { workspace = true, optional = true }
rustls.workspace = true
scc = { workspace = true, optional = true }
sockudo-ws.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-rustls.workspace = true
tokio-util.workspace = true
tower-http = { workspace = true, optional = true }
webpki-roots.workspace = true

[dev-dependencies]
trybuild.workspace = true

[features]
server = ["dep:nanoid", "dep:scc"]
http = ["dep:tower-http"]
test-libsetback = []

[[test]]
name = "server"
required-features = ["server"]

[lints]
workspace = true