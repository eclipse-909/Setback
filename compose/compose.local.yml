# compose.local.yml — Run setbackd locally with Traefik reverse proxy
#
# Prerequisites:
#   - Self-signed certs in ./certs/cert.pem and ./certs/key.pem
#     (see justfile for the openssl command to generate them)
#
# Access points:
#   localhost:80    → redirects to localhost:443
#   localhost:443   → setback_api (HTTPS)
#   localhost:42069 → setback_server (TCP TLS)
#   localhost:8080  → Traefik dashboard (insecure, no auth)
#   localhost:8081  → phpMyAdmin (direct port, plain HTTP)
#   localhost:3306  → MySQL (direct port)

name: setbackd

services:

  # ---------------------------------------------------------------------------
  # Traefik — reverse proxy, TLS termination
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.4
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "127.0.0.1:80:80"       # HTTP (redirects to HTTPS)
      - "127.0.0.1:443:443"     # HTTPS — setback_api
      - "127.0.0.1:42069:42069" # TCP TLS — setback_server game port
      - "127.0.0.1:8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_logs:/var/log/traefik
      - ./traefik/traefik.local.yml:/etc/traefik/traefik.yml:ro
      - ./certs:/etc/traefik/certs:ro
    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.game.address=:42069"

      # Attach the static configuration tls.yaml file that contains the tls configuration settings
      - "--providers.file.filename=/dynamic/tls.yaml"

      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"

      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=true"

      # Observability
      - "--log.level=INFO" # change this to DEBUG for more verbose logs
      - "--accesslog=true"
      - "--metrics.prometheus=true"

  # ---------------------------------------------------------------------------
  # setback_api — HTTP server on :8080, serves frontend + public API
  # ---------------------------------------------------------------------------
  setback_api:
    build:
      context: .
      args:
        PROFILE: debug
        PACKAGE: setback_api
        PORT: 8080
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/setbackdb-local
    expose:
      - "8080"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # --- HTTPS router (main) ---
      # PathPrefix(`/`) matches all requests on this entrypoint regardless of hostname.
      # This works locally because port 443 is exclusively for setback_api.
      - "traefik.http.routers.website-local-secure.entrypoints=websecure"
      - "traefik.http.routers.website-local-secure.rule=PathPrefix(`/`)"
      - "traefik.http.routers.website-local-secure.tls=true"
      - "traefik.http.routers.website-local-secure.service=website-local-svc"

      # --- HTTP → HTTPS redirect router ---
      - "traefik.http.routers.website-local.entrypoints=web"
      - "traefik.http.routers.website-local.rule=PathPrefix(`/`)"
      - "traefik.http.routers.website-local.middlewares=redirect-to-https-local"

      # --- HTTP → HTTPS redirect middleware ---
      - "traefik.http.middlewares.redirect-to-https-local.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https-local.redirectscheme.permanent=true"

      # --- Service (backend port) ---
      - "traefik.http.services.website-local-svc.loadbalancer.server.port=8080"
      - "traefik.http.services.website-local-svc.loadbalancer.healthcheck.path=/api/healthcheck"
      - "traefik.http.services.website-local-svc.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.website-local-svc.loadbalancer.healthcheck.timeout=3s"

  # ---------------------------------------------------------------------------
  # setback_server — TCP game server on :42069
  #
  # Graceful shutdown: when Dokploy deploys an update, a new container starts
  # and joins the Traefik load balancer. Traefik detects the old container is
  # stopping (via Docker event) and drains new connections to it while keeping
  # existing TCP connections alive for up to stop_grace_period. The old
  # container receives SIGTERM and shuts down once its sessions are complete or
  # the grace period expires.
  # ---------------------------------------------------------------------------
  setback_server:
    build:
      context: .
      args:
        PROFILE: debug
        PACKAGE: setback_server
        PORT: 42069
    restart: unless-stopped
    networks:
      - proxy
    stop_signal: SIGTERM
    stop_grace_period: 6h
    depends_on:
      setback_api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # --- TCP TLS router ---
      # HostSNI(`*`) matches any (or no) SNI, which is necessary when connecting
      # via localhost since there is no meaningful hostname to match on.
      # In production, compose.yml uses a specific HostSNI for SNI-based routing
      # between prod and dev — that distinction isn't needed locally.
      - "traefik.tcp.routers.server-local.entrypoints=game"
      - "traefik.tcp.routers.server-local.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.server-local.tls=true"
      - "traefik.tcp.routers.server-local.service=server-local-svc"

      # --- TCP service ---
      - "traefik.tcp.services.server-local-svc.loadbalancer.server.port=42069"

  # ---------------------------------------------------------------------------
  # MySQL database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    networks:
      - proxy
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: setbackdb-local
    expose:
      - "3306"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # phpMyAdmin — database UI (direct port, not behind Traefik)
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:alpine
    container_name: phpmyadmin
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - "80"
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  traefik_logs:
  mysql_data:

networks:
  proxy:
    name: proxy