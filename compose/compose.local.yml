# compose.local.yml — Run setbackd locally

name: setbackd

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy_net
    ports:
      - "127.0.0.1:80:80"       # setback_website (HTTP -> HTTPS redirect)
      - "127.0.0.1:443:443"     # setback_website (HTTPS)
      - "127.0.0.1:42069:42069" # setback_service
      - "127.0.0.1:8080:8080"   # Traefik Dashboard
      - "127.0.0.1:8081:8081"   # phpmyadmin
      - "127.0.0.1:3306:3306"   # mysql database
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_logs:/var/log/traefik
      - ./traefik/traefik.local.yml:/etc/traefik/traefik.yml:ro
      - ./certs:/etc/traefik/certs:ro

  setback_service:
    build:
      context: .
      args:
        PROFILE: debug
        PACKAGE: setback_service
        PORT: 42069
    restart: unless-stopped
    environment:
      DNS_NAME: localhost
    expose:
      - "42069"
    networks:
      - proxy_net
    stop_grace_period: 6h
    depends_on:
      setback_website:
        condition: service_healthy

  setback_website:
    build:
      context: .
      args:
        PROFILE: debug
        PACKAGE: setback_website
        PORT: 8080
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/setbackdb
      DNS_NAME: localhost
    expose:
      - "8080"
    networks:
      - proxy_net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/healthcheck" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped
    networks:
      - proxy_net
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: setbackdb
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:alpine
    container_name: phpmyadmin
    restart: unless-stopped
    networks:
      - proxy_net
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  traefik_logs:
  mysql_data:

networks:
  proxy_net: