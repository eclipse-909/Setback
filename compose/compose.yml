# compose.yml — Run setbackd in Dokploy (production & development environments)
#
# This file is used for BOTH production and development deployments in Dokploy.
# The differences between environments are controlled by environment variables
# defined in Dokploy's environment configuration (or a .env file).
#
# Required environment variables — set these in Dokploy's environment UI:
#
#   SUBDOMAIN             e.g. "setback" (prod) or "setback-dev" (dev)
#   ROOT_DOMAIN           e.g. "eclipse-909.com"
#   SETBACK_WEBSITE_IMAGE Full image reference for setback_api
#   SETBACK_SERVER_IMAGE  Full image reference for setback_server
#   DATABASE_URL          MySQL connection string for setback_api
#   TRAEFIK_AUTH          htpasswd-format credentials for Traefik dashboard
#                         (see .env.example for how to generate this)
#
# Derived domains (automatically constructed from the above):
#   Website:   ${SUBDOMAIN}.${ROOT_DOMAIN}
#   www:       www.${SUBDOMAIN}.${ROOT_DOMAIN}  → redirects to above
#   Traefik:   traefik.${SUBDOMAIN}.${ROOT_DOMAIN}
#   Game port: ${SUBDOMAIN}.${ROOT_DOMAIN}:42069 (TCP TLS via SNI)
#
# IMPORTANT — Dokploy isolated deployments:
#   Enable "Isolated Deployment" in Dokploy for this compose app. This gives
#   each deployment its own Docker network and prevents prod/dev name conflicts.
#   Dokploy will automatically connect Traefik (dokploy-traefik) to the
#   isolated network so labels are reachable.
#
# NOTE on the Traefik dashboard:
#   The dokploy-traefik instance manages routing for ALL apps on this server.
#   The dashboard labels below add a route for this deployment's subdomain.
#   Because Traefik is a shared singleton in Dokploy, the dashboard itself is
#   the same instance — these labels simply expose it at a new hostname.

name: setbackd

services:

  # ---------------------------------------------------------------------------
  # setback_api — HTTP server on :8080
  # Accessible at https://${SUBDOMAIN}.${ROOT_DOMAIN}
  # ---------------------------------------------------------------------------
  setback_api:
    image: ${SETBACK_WEBSITE_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - proxy
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # --- HTTPS router ---
      - "traefik.http.routers.website-${SUBDOMAIN}-secure.entrypoints=websecure"
      - "traefik.http.routers.website-${SUBDOMAIN}-secure.rule=Host(`${SUBDOMAIN}.${ROOT_DOMAIN}`) || Host(`www.${SUBDOMAIN}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.website-${SUBDOMAIN}-secure.tls=true"
      - "traefik.http.routers.website-${SUBDOMAIN}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.website-${SUBDOMAIN}-secure.service=website-${SUBDOMAIN}-svc"
      - "traefik.http.routers.website-${SUBDOMAIN}-secure.middlewares=www-redirect-${SUBDOMAIN}"

      # --- HTTP → HTTPS redirect ---
      - "traefik.http.routers.website-${SUBDOMAIN}.entrypoints=web"
      - "traefik.http.routers.website-${SUBDOMAIN}.rule=Host(`${SUBDOMAIN}.${ROOT_DOMAIN}`) || Host(`www.${SUBDOMAIN}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.website-${SUBDOMAIN}.middlewares=redirect-to-https@file"

      # --- Service ---
      - "traefik.http.services.website-${SUBDOMAIN}-svc.loadbalancer.server.port=8080"
      - "traefik.http.services.website-${SUBDOMAIN}-svc.loadbalancer.healthcheck.path=/api/healthcheck"
      - "traefik.http.services.website-${SUBDOMAIN}-svc.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.website-${SUBDOMAIN}-svc.loadbalancer.healthcheck.timeout=3s"

      # --- www → canonical redirect ---
      - "traefik.http.middlewares.www-redirect-${SUBDOMAIN}.redirectregex.regex=^https://www\\.${SUBDOMAIN}\\.${ROOT_DOMAIN}(.*)"
      - "traefik.http.middlewares.www-redirect-${SUBDOMAIN}.redirectregex.replacement=https://${SUBDOMAIN}.${ROOT_DOMAIN}$${1}"
      - "traefik.http.middlewares.www-redirect-${SUBDOMAIN}.redirectregex.permanent=true"

      # --- Traefik dashboard route (exposes the shared dokploy-traefik dashboard
      #     at traefik.${SUBDOMAIN}.${ROOT_DOMAIN}, secured with basic auth) ---
      - "traefik.http.routers.traefik-dashboard-${SUBDOMAIN}.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard-${SUBDOMAIN}.rule=Host(`traefik.${SUBDOMAIN}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard-${SUBDOMAIN}.tls=true"
      - "traefik.http.routers.traefik-dashboard-${SUBDOMAIN}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard-${SUBDOMAIN}.service=api@internal"
      - "traefik.http.routers.traefik-dashboard-${SUBDOMAIN}.middlewares=traefik-auth-${SUBDOMAIN}"

      # Basic auth middleware — TRAEFIK_AUTH must be in htpasswd format.
      # See .env.example for instructions on generating credentials.
      - "traefik.http.middlewares.traefik-auth-${SUBDOMAIN}.basicauth.users=${TRAEFIK_AUTH}"

  # ---------------------------------------------------------------------------
  # setback_server — TCP game server on :42069
  #
  # Graceful shutdown & zero-downtime updates:
  #   When Dokploy deploys an update it starts the new container first. Both
  #   old and new containers register with Traefik's TCP load balancer.
  #   Traefik routes all NEW TCP connections to healthy (new) instances and
  #   stops sending connections to containers that are stopping. Existing TCP
  #   sessions on the old container are preserved until the client disconnects
  #   or stop_grace_period expires. The old container receives SIGTERM and
  #   should begin its own graceful shutdown sequence.
  #
  #   SNI routing: clients connect to ${SUBDOMAIN}.${ROOT_DOMAIN}:42069 with
  #   TLS. Traefik inspects the SNI to route prod and dev traffic independently
  #   even though they share port 42069 on the host.
  # ---------------------------------------------------------------------------
  setback_server:
    image: ${SETBACK_SERVER_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "42069"
    networks:
      - proxy
      - dokploy-network
    stop_signal: SIGTERM
    stop_grace_period: 6h5m
    depends_on:
      setback_api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # --- TCP TLS router — SNI routes to correct environment ---
      - "traefik.tcp.routers.server-${SUBDOMAIN}.entrypoints=game"
      - "traefik.tcp.routers.server-${SUBDOMAIN}.rule=HostSNI(`${SUBDOMAIN}.${ROOT_DOMAIN}`)"
      - "traefik.tcp.routers.server-${SUBDOMAIN}.tls=true"
      - "traefik.tcp.routers.server-${SUBDOMAIN}.tls.certresolver=letsencrypt"
      - "traefik.tcp.routers.server-${SUBDOMAIN}.service=server-${SUBDOMAIN}-svc"

      # --- TCP service ---
      - "traefik.tcp.services.server-${SUBDOMAIN}-svc.loadbalancer.server.port=42069"
      # Brief delay before Traefik removes a stopping container from rotation,
      # giving it time to finish the current connection handshake.
      - "traefik.tcp.services.server-${SUBDOMAIN}-svc.loadbalancer.terminationdelay=100ms"

networks:
  # Internal network for service-to-service communication.
  # setback_server → setback_api communication uses this network directly
  # (e.g. http://setback_api:8080/api/...) without going through Traefik.
  proxy:

  # Dokploy's shared network — required for Traefik label routing.
  # Traefik (dokploy-traefik) watches this network for container label changes.
  dokploy-network:
    external: true
