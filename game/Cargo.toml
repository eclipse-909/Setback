[package]
name = "game"
version = "0.1.0"
edition = "2021"

[dependencies]
setback = { path = "../setback" }
egui_extras = { version = "0.30.0", features = ["default", "image"] }
image = "0.25.5"
tokio = { version = "1.42.0", features = ["full"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.30.0", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.30.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.30.0", default-features = false, features = ["default_fonts", "glow", "android-game-activity"] }

[build-dependencies]
embed-resource = "3.0.1"