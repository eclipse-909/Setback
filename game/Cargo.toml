[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
iced = { version = "0.13.1", features = ["wgpu", "image", "debug", "tokio", "auto-detect-theme", "advanced"] }
iced_aw = "0.12.2"
tokio = { version = "1.44.1", features = ["full"] }
tokio-util = "0.7.14"
bincode = "2.0.1"
keyring = { version = "3.6.2", features = ["linux-native-sync-persistent", "windows-native", "crypto-rust", "vendored"] }
env_logger = "0.11.7"
log = "0.4.27"
image = "0.24"