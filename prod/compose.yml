name: setback-services

services:
  setback_website:
    image: eclipse909/private:setback_website-latest
    healthcheck:
      test: [ "CMD-SHELL", "curl -L http://127.0.0.1:8080/api/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"        # HTTP  → redirect to HTTPS
      - "443:443"      # HTTPS → setback_website
      - "42069:42069"  # TLS   → setback_server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      setback_website:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: setback-services_default
    attachable: true